<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartVoyage · 智能旅行助手</title>
<style>
  /* ============ 基础与主题变量 ============ */
  :root {
    --bg: #0b0f1a;
    --bg-panel: rgba(255, 255, 255, 0.04);
    --bg-panel-strong: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e6eaf2;
    --text-dim: #8b94a7;
    --accent: #38bdf8;
    --accent-2: #a78bfa;
    --online: #34d399;
    --offline: #f87171;
    --user-bubble: linear-gradient(135deg, #2563eb, #4f46e5);
    --radius: 14px;
    --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(56, 189, 248, 0.12), transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, rgba(167, 139, 250, 0.12), transparent 60%),
      var(--bg);
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }

  /* ============ 整体布局 ============ */
  .app { display: flex; height: 100vh; }

  /* ============ 左侧边栏 ============ */
  .sidebar {
    width: 300px; flex-shrink: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--bg-panel);
    backdrop-filter: blur(14px);
    padding: 22px 18px;
    gap: 20px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center; font-size: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 18px rgba(56,189,248,.35);
  }
  .brand h1 { font-size: 18px; letter-spacing: .5px; }
  .brand p { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .side-section h2 {
    font-size: 12px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }

  /* Agent 卡片 */
  .agent-card {
    background: var(--bg-panel-strong);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
    transition: border-color .2s, transform .2s;
  }
  .agent-card:hover { border-color: rgba(56,189,248,.4); transform: translateY(-1px); }
  .agent-card.active { border-color: var(--accent); box-shadow: 0 0 14px rgba(56,189,248,.25); }
  .agent-head { display: flex; align-items: center; gap: 8px; }
  .agent-icon { font-size: 18px; }
  .agent-name { font-size: 13.5px; font-weight: 600; font-family: var(--mono); flex: 1; word-break: break-all; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--online); box-shadow: 0 0 8px var(--online);
    animation: pulse 2s infinite;
  }
  .status-dot.offline { background: var(--offline); box-shadow: 0 0 8px var(--offline); animation: none; }
  @keyframes pulse { 50% { opacity: .4; } }
  .agent-desc { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .agent-url { font-size: 11px; color: var(--text-dim); font-family: var(--mono); margin-top: 4px; opacity: .7; }
  .agent-status-text { font-size: 11px; margin-top: 6px; color: var(--online); }
  .agent-status-text.offline { color: var(--offline); }

  /* 记忆面板 */
  .memory-panel {
    background: linear-gradient(135deg, rgba(56,189,248,.08), rgba(167,139,250,.08));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 12.5px;
  }
  .memory-panel .pref { color: var(--text); line-height: 1.7; }
  .memory-panel .pref strong { color: var(--accent); font-weight: 600; }
  .memory-empty { color: var(--text-dim); }
  .clear-memory-btn {
    margin-top: 10px; width: 100%;
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px; font-size: 12px; cursor: pointer;
    transition: all .2s;
  }
  .clear-memory-btn:hover { color: var(--offline); border-color: var(--offline); }

  /* ============ 右侧主区域 ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    backdrop-filter: blur(14px);
  }
  .topbar .title { font-size: 15px; font-weight: 600; }
  .topbar .conn { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }

  /* 对话区 */
  .chat-scroll { flex: 1; overflow-y: auto; padding: 26px clamp(20px, 6vw, 90px); }
  .messages { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .msg-row { display: flex; gap: 12px; align-items: flex-start; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .msg-row.user .avatar { background: var(--user-bubble); }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14.5px; line-height: 1.75;
    word-break: break-word;
  }
  .msg-row.ai .bubble {
    background: var(--bg-panel-strong);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    border-top-right-radius: 4px;
  }

  /* Markdown 渲染样式 */
  .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; line-height: 1.4; }
  .bubble h1 { font-size: 18px; } .bubble h2 { font-size: 16px; } .bubble h3 { font-size: 15px; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { margin: 6px 0 6px 22px; }
  .bubble code {
    font-family: var(--mono); font-size: 12.5px;
    background: rgba(0,0,0,.35); padding: 2px 6px; border-radius: 6px;
  }
  .bubble pre { background: rgba(0,0,0,.45); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 8px 0; }
  .bubble pre code { background: none; padding: 0; }
  .bubble blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--text-dim); margin: 6px 0; }
  .bubble table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  .bubble th { background: rgba(56,189,248,.1); color: var(--accent); }
  .bubble a { color: var(--accent); }

  /* 打字光标 */
  .typing-cursor::after {
    content: "▍"; color: var(--accent);
    animation: blink 0.8s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ A2A 轨迹卡片 ============ */
  .trace-card {
    max-width: 78%;
    align-self: flex-start;
    margin-left: 48px;
    background: rgba(56,189,248,.05);
    border: 1px dashed rgba(56,189,248,.35);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .trace-title {
    font-size: 11px; letter-spacing: 1px; color: var(--accent);
    font-family: var(--mono); text-transform: uppercase;
  }
  .trace-step { display: flex; align-items: center; gap: 8px; color: var(--text-dim); transition: color .3s; }
  .trace-step.running { color: var(--text); }
  .trace-step.done { color: var(--online); }
  .trace-step .step-icon { width: 18px; text-align: center; }
  .spinner {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid rgba(56,189,248,.3); border-top-color: var(--accent);
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .agent-tag {
    display: inline-block; padding: 1px 8px; margin: 0 2px;
    border-radius: 999px; font-size: 12px;
    background: rgba(167,139,250,.15); color: var(--accent-2);
    border: 1px solid rgba(167,139,250,.35);
    font-family: var(--mono);
  }

  /* 欢迎区与快捷 Prompt */
  .welcome { text-align: center; padding: 40px 0 10px; }
  .welcome .big-logo {
    width: 64px; height: 64px; margin: 0 auto 14px; font-size: 34px;
    border-radius: 18px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 30px rgba(56,189,248,.4);
  }
  .welcome h2 { font-size: 22px; margin-bottom: 8px; }
  .welcome p { color: var(--text-dim); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg-panel-strong);
    border-radius: 999px; padding: 8px 16px;
    font-size: 13px; cursor: pointer; color: var(--text);
    transition: all .2s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

  /* ============ 输入区 ============ */
  .input-area {
    padding: 14px clamp(20px, 6vw, 90px) 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    backdrop-filter: blur(14px);
  }
  .input-box {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--bg-panel-strong);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 10px 10px 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 16px rgba(56,189,248,.18); }
  textarea {
    flex: 1; resize: none; border: none; outline: none;
    background: transparent; color: var(--text);
    font-family: var(--font); font-size: 14.5px; line-height: 1.6;
    max-height: 140px;
  }
  textarea::placeholder { color: var(--text-dim); }
  .send-btn {
    width: 40px; height: 40px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 17px; cursor: pointer;
    display: grid; place-items: center;
    transition: opacity .2s, transform .2s;
    flex-shrink: 0;
  }
  .send-btn:hover { transform: scale(1.06); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .input-hint { max-width: 860px; margin: 8px auto 0; font-size: 11px; color: var(--text-dim); text-align: right; }

  /* 移动端适配 */
  @media (max-width: 820px) {
    .sidebar { display: none; }
    .bubble, .trace-card { max-width: 92%; }
    .trace-card { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 左侧边栏：Agent 状态 + 记忆 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">✈️</div>
      <div>
        <h1>SmartVoyage</h1>
        <p>A2A 分布式旅行智能体</p>
      </div>
    </div>

    <div class="side-section">
      <h2>⚡ 子代理网络</h2>
      <div id="agentList"></div>
    </div>

    <div class="side-section">
      <h2>🧠 记忆模块</h2>
      <div class="memory-panel">
        <div id="memoryContent" class="memory-empty">正在读取记忆...</div>
        <button class="clear-memory-btn" id="clearMemoryBtn">清空记忆</button>
      </div>
    </div>
  </aside>

  <!-- ============ 右侧主区域 ============ -->
  <main class="main">
    <header class="topbar">
      <div class="title">🌐 智能旅行对话</div>
      <div class="conn">
        <span class="status-dot" id="connDot"></span>
        <span id="connText">检测后端连接中...</span>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="messages" id="messages">
        <!-- 欢迎页 -->
        <div class="welcome" id="welcome">
          <div class="big-logo">🧭</div>
          <h2>你好，我是 SmartVoyage</h2>
          <p>由我统一调度天气、票务、行程等子代理，为你完成复合旅行任务。</p>
          <div class="chips" id="chips"></div>
        </div>
      </div>
    </div>

    <footer class="input-area">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="输入你的旅行问题，例如：北京明天天气怎么样，顺便帮我查一下去北京的高铁"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">➤</button>
      </div>
      <div class="input-hint">Enter 发送 · Shift + Enter 换行</div>
    </footer>
  </main>
</div>

<script>
/* =====================================================
 * SmartVoyage 前端逻辑
 *  - 对接后端：POST /api/chat/stream (SSE)
 *              GET  /api/agents  /api/memory
 *  - 后端不可用时自动降级为本地 Mock，保证界面可演示
 * ===================================================== */

const API = {
  stream:  "/api/chat/stream",
  agents:  "/api/agents",
  memory:  "/api/memory",
  clearMemory: "/api/memory/clear",
};

/* ---------- Mock 数据（后端离线时的兜底） ---------- */
const MOCK_AGENTS = [
  { name: "WeatherQueryAssistant", description: "天气查询助手", url: "http://localhost:5005", status: "在线", skills: [] },
  { name: "TicketAssistant",       description: "票务查询助手", url: "http://localhost:5006", status: "在线", skills: [] },
  { name: "TripAssistant",         description: "行程规划助手", url: "http://localhost:5007", status: "在线", skills: [] },
];
const MOCK_PROFILE = { "座位偏好": "二等座", "舱位偏好": "经济舱" };

const AGENT_ICONS = {
  WeatherQueryAssistant: "🌤️",
  TicketAssistant: "🎫",
  TripAssistant: "🗺️",
};
const AGENT_LABELS = {
  WeatherQueryAssistant: "天气代理",
  TicketAssistant: "票务代理",
  TripAssistant: "行程代理",
};

const QUICK_PROMPTS = [
  "北京明日天气与高铁",
  "三亚亲子游计划",
  "帮我查一下去成都的高铁票",
];

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages");
const chatScroll = $("chatScroll");
const inputEl    = $("input");
const sendBtn    = $("sendBtn");

let backendOnline = false;
let isStreaming   = false;

/* =====================================================
 * 极简 Markdown 渲染器（支持标题/加粗/列表/表格/代码块等）
 * ===================================================== */
function renderMarkdown(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = src.split("\n");
  let html = "", inCode = false, inList = null, inTable = false;

  const inline = (s) =>
    esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  const closeBlocks = () => {
    if (inList)  { html += `</${inList}>`; inList = null; }
    if (inTable) { html += "</tbody></table>"; inTable = false; }
  };

  for (const raw of lines) {
    const line = raw;
    if (line.trim().startsWith("```")) {
      if (inCode) { html += "</code></pre>"; inCode = false; }
      else { closeBlocks(); html += "<pre><code>"; inCode = true; }
      continue;
    }
    if (inCode) { html += esc(line) + "\n"; continue; }

    // 表格
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const cells = line.trim().slice(1, -1).split("|").map((c) => c.trim());
      if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue; // 分隔行
      if (!inTable) {
        closeBlocks();
        html += "<table><tbody>";
        html += "<tr>" + cells.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
      }
      continue;
    }
    if (inTable) closeBlocks();

    // 标题
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { closeBlocks(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }

    // 引用
    if (/^\s*>/.test(line)) { closeBlocks(); html += `<blockquote>${inline(line.replace(/^\s*>\s*/, ""))}</blockquote>`; continue; }

    // 列表
    const ul = line.match(/^\s*[-*•]\s+(.*)/);
    const ol = line.match(/^\s*\d+[.、]\s+(.*)/);
    if (ul) { if (inList !== "ul") { closeBlocks(); html += "<ul>"; inList = "ul"; } html += `<li>${inline(ul[1])}</li>`; continue; }
    if (ol) { if (inList !== "ol") { closeBlocks(); html += "<ol>"; inList = "ol"; } html += `<li>${inline(ol[1])}</li>`; continue; }

    // 普通段落
    if (line.trim() === "") { closeBlocks(); continue; }
    closeBlocks();
    html += `<p>${inline(line)}</p>`;
  }
  closeBlocks();
  if (inCode) html += "</code></pre>";
  return html;
}

/* =====================================================
 * 侧栏：Agent 状态
 * ===================================================== */
async function loadAgents() {
  let agents = MOCK_AGENTS;
  try {
    const res = await fetch(API.agents);
    if (!res.ok) throw new Error();
    const json = await res.json();
    agents = json.data || MOCK_AGENTS;
    setConn(true);
  } catch {
    setConn(false);
  }
  $("agentList").innerHTML = agents.map((a) => {
    const online = a.status === "在线";
    return `
      <div class="agent-card" data-agent="${a.name}">
        <div class="agent-head">
          <span class="agent-icon">${AGENT_ICONS[a.name] || "🤖"}</span>
          <span class="agent-name">${a.name}</span>
          <span class="status-dot ${online ? "" : "offline"}"></span>
        </div>
        <div class="agent-desc">${a.description || ""}</div>
        <div class="agent-url">${a.url || ""}</div>
        <div class="agent-status-text ${online ? "" : "offline"}">${online ? "● 在线" : "● 离线"}</div>
      </div>`;
  }).join("");
}

function setConn(online) {
  backendOnline = online;
  $("connDot").className = "status-dot" + (online ? "" : " offline");
  $("connText").textContent = online ? "后端已连接" : "后端未连接（演示模式）";
}

/** 高亮正在被调用的 Agent 卡片 */
function highlightAgents(names, on) {
  document.querySelectorAll(".agent-card").forEach((card) => {
    card.classList.toggle("active", on && names.includes(card.dataset.agent));
  });
}

/* =====================================================
 * 侧栏：记忆模块
 * ===================================================== */
async function loadMemory() {
  let profile = MOCK_PROFILE;
  try {
    const res = await fetch(API.memory);
    if (!res.ok) throw new Error();
    const json = await res.json();
    profile = (json.data && json.data.user_profile) || {};
  } catch { /* 保持 mock */ }

  const entries = Object.entries(profile).filter(([k, v]) => v && k !== "notes");
  $("memoryContent").innerHTML = entries.length
    ? `<div class="pref">已记住您的偏好：${entries.map(([k, v]) => `<strong>${v}</strong>`).join("、")}</div>`
    : `<div class="memory-empty">暂无偏好记忆，与我聊聊试试吧。</div>`;
}

$("clearMemoryBtn").addEventListener("click", async () => {
  try { await fetch(API.clearMemory, { method: "POST" }); } catch {}
  await loadMemory();
  addAiMessage("🧹 记忆已清空，我们重新认识一下吧。");
});

/* =====================================================
 * 消息渲染
 * ===================================================== */
function scrollToBottom() {
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function addUserMessage(text) {
  $("welcome")?.remove();
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `<div class="avatar">🧑</div><div class="bubble"></div>`;
  row.querySelector(".bubble").textContent = text;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function addAiMessage(markdownText) {
  $("welcome")?.remove();
  const row = document.createElement("div");
  row.className = "msg-row ai";
  row.innerHTML = `<div class="avatar">🧭</div><div class="bubble"></div>`;
  row.querySelector(".bubble").innerHTML = renderMarkdown(markdownText);
  messagesEl.appendChild(row);
  scrollToBottom();
  return row.querySelector(".bubble");
}

/* =====================================================
 * A2A 执行轨迹（任务拆解动画）
 * ===================================================== */
function detectAgents(text) {
  const hit = [];
  if (/天气|气温|下雨|温度|weather/i.test(text)) hit.push("WeatherQueryAssistant");
  if (/高铁|火车|票|机票|车票|航班|动车/.test(text)) hit.push("TicketAssistant");
  if (/行程|攻略|旅游|游玩|计划|路线|景点|亲子游|两日游|一日游/.test(text)) hit.push("TripAssistant");
  return hit;
}

function createTraceCard(agentNames) {
  $("welcome")?.remove();
  const card = document.createElement("div");
  card.className = "trace-card";

  const callLabel = agentNames.length > 1
    ? `正在并行调用 ${agentNames.map((n) => `<span class="agent-tag">${AGENT_LABELS[n] || n}</span>`).join(" 和 ")}...`
    : agentNames.length === 1
      ? `正在调用 <span class="agent-tag">${AGENT_LABELS[agentNames[0]] || agentNames[0]}</span>...`
      : "正在生成回复...";

  card.innerHTML = `
    <div class="trace-title">A2A · 协作轨迹</div>
    <div class="trace-step running" data-step="0">
      <span class="step-icon"><span class="spinner"></span></span>
      <span>🤖 正在识别意图...</span>
    </div>
    <div class="trace-step" data-step="1">
      <span class="step-icon">⚡</span><span>${callLabel}</span>
    </div>
    <div class="trace-step" data-step="2">
      <span class="step-icon">📦</span><span>聚合结果并格式化输出</span>
    </div>`;
  messagesEl.appendChild(card);
  scrollToBottom();

  const steps = card.querySelectorAll(".trace-step");
  return {
    card,
    /** 推进到第 i 步（0 起），之前的步骤标记完成 */
    advance(i) {
      steps.forEach((s, idx) => {
        if (idx < i) { s.className = "trace-step done"; s.querySelector(".step-icon").innerHTML = "✓"; }
        else if (idx === i) { s.className = "trace-step running"; }
      });
      if (i === 1) highlightAgents(agentNames, true);
      scrollToBottom();
    },
    finish() {
      steps.forEach((s) => { s.className = "trace-step done"; s.querySelector(".step-icon").innerHTML = "✓"; });
      highlightAgents(agentNames, false);
      scrollToBottom();
    },
  };
}

/* =====================================================
 * 发送与流式接收
 * ===================================================== */
async function sendMessage(text) {
  text = (text ?? inputEl.value).trim();
  if (!text || isStreaming) return;

  isStreaming = true;
  sendBtn.disabled = true;
  inputEl.value = "";
  autoResize();

  addUserMessage(text);

  const agents = detectAgents(text);
  const trace = createTraceCard(agents);

  // 意图识别动画推进（纯 UI 节奏，不阻塞请求）
  setTimeout(() => trace.advance(1), 500);

  let answered = false;
  try {
    const bubble = addAiMessage("");
    bubble.classList.add("typing-cursor");
    await streamFromBackend(text, bubble, trace);
    answered = true;
  } catch {
    // 后端不可用 → 本地 Mock 流式演示
    trace.advance(1);
    await mockStreamReply(text, agents, trace);
    answered = true;
  } finally {
    trace.finish();
    isStreaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
    loadMemory(); // 回复后刷新记忆面板
  }
  return answered;
}

/** 真实后端：POST + ReadableStream 读取 SSE，逐字渲染 */
async function streamFromBackend(text, bubble, trace) {
  const res = await fetch(API.stream, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text }),
  });
  if (!res.ok || !res.body) throw new Error("backend unavailable");
  setConn(true);

  const reader  = res.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "", full = "", firstChunk = true;

  // 打字机平滑队列：把到达的文本块排队，匀速吐出
  const queue = [];
  let pumping = false;
  const pump = () => {
    if (pumping) return;
    pumping = true;
    const tick = () => {
      if (queue.length === 0) { pumping = false; return; }
      full += queue.shift();
      bubble.innerHTML = renderMarkdown(full);
      scrollToBottom();
      setTimeout(tick, 16); // ~60fps 打字节奏
    };
    tick();
  };

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const events = buffer.split("\n\n");
    buffer = events.pop(); // 最后一段可能不完整
    for (const evt of events) {
      const line = evt.trim();
      if (!line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      if (payload === "[DONE]") continue;
      try {
        const { chunk } = JSON.parse(payload);
        if (chunk) {
          if (firstChunk) { firstChunk = false; trace.advance(2); }
          // 按字符入队，实现平滑打字机
          for (const ch of chunk) queue.push(ch);
          pump();
        }
      } catch { /* 忽略非 JSON 行 */ }
    }
  }

  // 等待队列吐完后收尾
  await new Promise((resolve) => {
    const check = () => (queue.length === 0 && !pumping) ? resolve() : setTimeout(check, 60);
    check();
  });
  bubble.classList.remove("typing-cursor");
}

/** 本地 Mock：离线演示模式（同样走打字机） */
async function mockStreamReply(text, agents, trace) {
  await sleep(900);
  trace.advance(2);
  await sleep(500);

  const bubble = addAiMessage("");
  bubble.classList.add("typing-cursor");

  const reply = buildMockReply(text, agents);
  for (const ch of reply) {
    bubble.dataset.raw = (bubble.dataset.raw || "") + ch;
    bubble.innerHTML = renderMarkdown(bubble.dataset.raw);
    scrollToBottom();
    await sleep(18);
  }
  bubble.classList.remove("typing-cursor");
  delete bubble.dataset.raw;
}

function buildMockReply(text, agents) {
  const parts = [];
  if (agents.includes("WeatherQueryAssistant")) {
    parts.push(
`## 🌤️ 天气查询结果（演示数据）

| 城市 | 日期 | 天气 | 气温 |
| --- | --- | --- | --- |
| 北京 | 明天 | 晴转多云 | 3℃ ~ 12℃ |

> 空气质量良好，适合出行，早晚温差较大注意添衣。`);
  }
  if (agents.includes("TicketAssistant")) {
    parts.push(
`## 🎫 高铁票务（演示数据）

| 车次 | 出发 - 到达 | 历时 | 二等座 |
| --- | --- | --- | --- |
| G103 | 上海虹桥 08:00 → 北京南 12:32 | 4h32m | ¥553 |
| G113 | 上海虹桥 09:05 → 北京南 13:41 | 4h36m | ¥553 |

已按您的偏好 **二等座** 筛选。`);
  }
  if (agents.includes("TripAssistant")) {
    parts.push(
`## 🗺️ 行程建议（演示数据）

1. **Day 1**：抵达后入住酒店 → 下午游览核心景区 → 晚餐品尝当地特色。
2. **Day 2**：上午亲子/休闲项目 → 下午返程。

如需更详细的多日规划，告诉我天数和预算即可。`);
  }
  if (parts.length === 0) {
    parts.push(
`你好！我是 **SmartVoyage** 智能旅行助手（当前为离线演示模式）。

我可以帮你：
- 🌤️ 查询城市天气
- 🎫 查询高铁 / 机票
- 🗺️ 规划旅行行程

试试点击上方的快捷 Prompt，或输入复合任务，例如：
\`北京明天天气怎么样，顺便帮我查一下去北京的高铁\``);
  }
  parts.push(`\n\n---\n*本次回复由主控 LLM 拆解任务后，经 A2A 协议调度 ${agents.length ? agents.map((a) => `**${AGENT_LABELS[a]}**`).join("、") : "主助手"}* 协作完成。`);
  return parts.join("\n\n");
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* =====================================================
 * 输入交互
 * ===================================================== */
function autoResize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
}
inputEl.addEventListener("input", autoResize);

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener("click", () => sendMessage());

/* ---------- 快捷 Prompt ---------- */
$("chips").innerHTML = QUICK_PROMPTS.map((p) => `<button class="chip">${p}</button>`).join("");
document.querySelectorAll(".chip").forEach((c) =>
  c.addEventListener("click", () => sendMessage(c.textContent))
);

/* ---------- 初始化 ---------- */
(async function init() {
  await Promise.all([loadAgents(), loadMemory()]);
  try {
    const res = await fetch(API.agents);
    setConn(res.ok);
  } catch {
    setConn(false);
  }
  inputEl.focus();
})();
</script>
